name: graphql_server3
version: 3.2.2
description: >-
  A GraphQL server runtime for Dart. Executes queries, mutations and
  subscriptions against a graphql_schema3 schema, with introspection built in.
homepage: https://github.com/raphrmx/graphql_server3
repository: https://github.com/raphrmx/graphql_server3
issue_tracker: https://github.com/raphrmx/graphql_server3/issues

topics:
  - graphql
  - server
  - api

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  graphql_parser3: ^3.2.1
  graphql_schema3: ^3.2.1
  stream_channel: ^2.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

# Uncomment while working on the sibling packages: without these, the two
# dependencies above are resolved from pub.dev and local edits have no effect.
#dependency_overrides:
#  graphql_parser3:
#    path: ../graphql_parser3
#  graphql_schema3:
#    path: ../graphql_schema3
