name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catches SDK drift on a package that can go months without a commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]

    # The beta leg is an early warning, not a gate.
    continue-on-error: ${{ matrix.sdk == 'beta' }}

    name: ${{ matrix.sdk }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
